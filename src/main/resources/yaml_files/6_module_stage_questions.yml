- prompt: |
    Which programming paradigm determines the flow of execution based on events such as user actions, sensor outputs, or system messages?
  choices:
    - "Procedural programming"
    - "Event-driven programming"
    - "Functional programming"
    - "Declarative programming"
  correctChoiceIndx: 1

- prompt: |
    What central mechanism in an event-driven application runs continuously in the background to listen for and dispatch events to callbacks?
  choices:
    - "Main thread loader"
    - "Event loop / Scheduler"
    - "Bytecode compiler"
    - "Memory manager"
  correctChoiceIndx: 1

- prompt: |
    In an event-driven Swing application, which class object represents a click action triggered on a JButton?
  choices:
    - "MouseEvent"
    - "ActionEvent"
    - "ComponentEvent"
    - "ItemEvent"
  correctChoiceIndx: 1

- prompt: |
    Which Java interface must be implemented to handle click events on a JButton?
  choices:
    - "ActionListener"
    - "MouseListener"
    - "KeyListener"
    - "WindowListener"
  correctChoiceIndx: 0

- prompt: |
    What is the primary purpose of an adapter class (such as MouseAdapter) in Java Swing?
  choices:
    - "To automatically optimize graphics rendering performance."
    - "To provide empty default implementations for listener interface methods."
    - "To convert event objects into thread-safe data streams."
    - "To allow multiple inheritance of concrete GUI components."
  correctChoiceIndx: 1

- prompt: |
    Which method in the MouseListener interface is triggered when the mouse pointer moves inside a component's visual boundaries?
  choices:
    - "mouseClicked()"
    - "mouseHovered()"
    - "mouseEntered()"
    - "mousePressed()"
  correctChoiceIndx: 2

- prompt: |
    How does an event source register a listener to listen for an Xxx event in Java Swing?
  choices:
    - "sourceComponent.registerXxxListener(listener)"
    - "sourceComponent.addXxxListener(listener)"
    - "sourceComponent.setXxxListener(listener)"
    - "sourceComponent.bindXxxListener(listener)"
  correctChoiceIndx: 1

- prompt: |
    Why can an event handler NOT be created by extending an adapter class directly inside a main class that extends JFrame?
  choices:
    - "Adapter classes are restricted to private package access."
    - "Java does not support multiple inheritance of classes."
    - "JFrame already implements all listener interfaces by default."
    - "Adapter classes cannot be inherited by GUI classes."
  correctChoiceIndx: 1

- prompt: |
    What are the three main participants involved in event handling in Java Swing?
  choices:
    - "The compiler, the JVM, and the application."
    - "The source component, the event object, and the event listener."
    - "The user interface, the database, and the operating system."
    - "The main loop, the thread pool, and the garbage collector."
  correctChoiceIndx: 1

- prompt: |
    The following statements about event-driven programming are true except one:
  choices:
    - "The flow of control is primarily driven by user actions or system messages."
    - "An event listener interface with a single abstract method can be instantiated using a lambda expression."
    - "Event-driven applications always require a procedural batch compiler to execute."
    - "An event handler can alter system state or trigger subsequent events."
  correctChoiceIndx: 2