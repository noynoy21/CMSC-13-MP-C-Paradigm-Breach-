# CONCEPTUAL QUESTIONS

- id: "q-00103"
  prompt: |
    Which programming paradigm is characterized by programming with state and commands that directly modify that state?
  choices:
    - "Imperative programming"
    - "Declarative programming"
    - "Functional programming"
    - "Logic programming"
  correctChoiceIndx: 0

- id: "q-00104"
