- id: "q-00110"
  prompt: |
    What core characteristic distinguishes declarative programming from imperative programming?
  choices:
    - "Declarative specifies HOW to achieve a result step-by-step."
    - "Declarative specifies WHAT result is desired rather than explicit control flow."
    - "Declarative relies heavily on mutable state and global variables."
    - "Declarative execution order is strictly determined by sequencing commands."
  correctChoiceIndx: 1

- id: "q-00111"
  prompt: |
    Which language notation was introduced alongside ALGOL 60 to formally define programming language syntax?
  choices:
    - "Turing notation"
    - "Backus-Naur Form (BNF)"
    - "Axiomatic semantics"
    - "Assembly mnemonics"
  correctChoiceIndx: 1

- id: "q-00112"
  prompt: |
    The following statements about imperative and declarative paradigms are true except one:
  choices:
    - "Imperative programming focuses on explicit state modifications and control flow."
    - "Declarative programming avoids explicit side-effects and step-by-step algorithms."
    - "Imperative programs are based on logical abstractions of the Von Neumann architecture."
    - "Declarative programs rely on goto statements and direct hardware register manipulation."
  correctChoiceIndx: 3

