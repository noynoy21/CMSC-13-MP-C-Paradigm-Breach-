- prompt: |
    parent(tom, bob).
    parent(bob, ann).

    ?- parent(tom, X), parent(X, Y).
  choices:
    - "X = bob,\nY = ann."
    - "X = tom,\nY = bob."
    - "X = bob,\nY = tom."
    - "false."
  correctChoiceIndx: 0

- prompt: |
