    ?- [Head | Tail] = [1, 2, 3, 4], /* MISSING CODE */.
    ```

    *Output*

    ```
    Result = [2, 3, 4].
    ```
  choices:
    - |
      Result = Head
    - |
      Result = Tail
    - |
      Result = [Head]
    - |
      Result = [Tail]
  correctChoiceIndx: 1