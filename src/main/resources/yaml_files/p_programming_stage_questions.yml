- prompt: |
    Which line should replace /* MISSING CODE */ in the snippet to make the output?

    *Snippet*

    ```prolog
    likes(john, pizza).
    likes(mary, pasta).

    ?- /* MISSING CODE */
    ```

    *Output*

    ```
    X = pizza.
    ```
  choices:
    - |
      likes(john, X).
    - |
      likes(X, pizza).
    - |
      likes(mary, X).
    - |
      likes(X, pasta).
  correctChoiceIndx: 0

- prompt: |
    Which line should replace /* MISSING CODE */ in the snippet to make the output?

    *Snippet*

    ```prolog
    parent(pam, bob).
    parent(tom, bob).
    parent(tom, liz).

    grandparent(X, Z) :- parent(X, Y), /* MISSING CODE */.

    ?- grandparent(pam, liz).
    ```

    *Output*

    ```
    false.
    ```
  choices:
    - |
      parent(Z, Y)
    - |
      parent(Y, Z)
    - |
      parent(X, Z)
    - |
      grandparent(Y, Z)
  correctChoiceIndx: 1

- prompt: |
    Which line should replace /* MISSING CODE */ in the snippet to make the output?

